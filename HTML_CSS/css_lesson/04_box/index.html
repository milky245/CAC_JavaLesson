<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>④ 余白（paddingとmargin）</title>
        <style>
            .container {
                background-color: #dddddd;
                padding: 20px; /* 親要素の内側に余白を作る */
            }

            .box {
                background-color: #ffeb3b; /* 黄色 */
                border: 3px solid #f44336; /* 赤い枠線 */
            }

            .demo-padding {
                /* TODO 枠線の【内側】の余白（黄色い部分が広がる）
                15px 20px 20px 15px
                */
            }

            .demo-margin {
                /* TODO 枠線の【外側】の余白（外のグレーとの隙間が広がる）
                15px 20px 20px 15px
                */
            }
        </style>
    </head>
    <body>
        <h1>paddingとmarginの違い</h1>
        <p>赤い枠線を基準にして、余白がどこにできるか観察しましょう。</p>

        <div class="container">
            <h2>1. padding（内側の余白）を広くした場合</h2>
            <div class="box demo-padding">
                <p>
                    枠線の【内側】に余白ができます。<br />背景色（黄色）の領域が広がります。
                </p>
            </div>

            <hr />

            <h2>2. margin（外側の余白）を広くした場合</h2>
            <div class="box demo-margin">
                <p>
                    枠線の【外側】に余白ができます。<br />背景色（黄色）は広がらず、他の要素との距離が離れます。
                </p>
            </div>
        </div>
    </body>
</html>
